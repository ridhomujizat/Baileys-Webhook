version: '3.8'

services:
  baileys-webhook:
    build: .
    container_name: baileys-webhook
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./sessions:/app/sessions
    environment:
      - PORT=3000
      - WEBHOOK_URL=${WEBHOOK_URL}
      - SESSION_PATH=/app/sessions
      - TOKEN=${TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
