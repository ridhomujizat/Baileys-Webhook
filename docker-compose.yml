version: '3.8'

services:
  baileys-webhook:
    build: .
    container_name: baileys-webhook
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./sessions:/app/sessions
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WEBHOOK_URL=${WEBHOOK_URL}
      - SESSION_PATH=/app/sessions
      - STATIC_PATH=/app/public
      - TOKEN=${TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

